name: ToE SP3 dust Lambda source class v0.23

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5F_SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_dust_lambda_source_class_v0_23.py"
      - ".github/workflows/toe-sp3-dust-lambda-source-class-v0-23.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5F_SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_dust_lambda_source_class_v0_23.py"
      - ".github/workflows/toe-sp3-dust-lambda-source-class-v0-23.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy
      - name: Validate SP3 dust plus Lambda effective source class
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_dust_lambda_source_class_v0_23.py | tee build/SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.json
          grep -Fq '"status": "PASS"' build/SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.json
          grep -Fq '"all_five_source_anchors_included": true' build/SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.json
          grep -Fq '"one_common_Lambda_and_A_fit_used_for_all_five_anchors": true' build/SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.json
          grep -Fq '"effective_source_class_only_not_W6_evidence": true' build/SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.json
          grep -Fq '"physical_production_claim": false' build/SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-dust-lambda-source-class-v0-23
          path: build/SP3_DUST_LAMBDA_SOURCE_CLASS_V0_23.json
