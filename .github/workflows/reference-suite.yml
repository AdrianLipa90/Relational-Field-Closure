name: RFC reference suite

on:
  push:
    branches:
      - feat/rfc-gremlin-pnv-holonomy-v0.1
  pull_request:
    paths:
      - 'formalism/**'
      - 'experiments/**'
      - 'tests/reference/**'
      - 'validation/**'
      - 'CROSS_REFERENCE_LOCK.json'
      - '.github/workflows/reference-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install pytest numpy
      - name: Run RFC reference suite
        run: python -m pytest -q tests/reference
