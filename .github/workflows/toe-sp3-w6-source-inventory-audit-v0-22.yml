name: ToE SP3 W6 source inventory audit v0.22

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5E_SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_w6_existing_source_inventory_audit_v0_22.py"
      - ".github/workflows/toe-sp3-w6-source-inventory-audit-v0-22.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5E_SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_w6_existing_source_inventory_audit_v0_22.py"
      - ".github/workflows/toe-sp3-w6-source-inventory-audit-v0-22.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit existing source candidates against W6
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_w6_existing_source_inventory_audit_v0_22.py | tee build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
          grep -Fq '"status": "PASS"' build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
          grep -Fq '"current_internal_W6_qualifier_count": 0' build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
          grep -Fq '"local_solver_is_inverse_geometry_to_source_not_independent_source_evidence": true' build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
          grep -Fq '"sp3_observational_receipt_has_external_geometry_evidence_but_no_source_tensor": true' build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
          grep -Fq '"existing_internal_W6_qualifier": "NONE_FOUND"' build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
          grep -Fq '"physical_production_claim": false' build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-w6-source-inventory-audit-v0-22
          path: build/SP3_W6_EXISTING_SOURCE_INVENTORY_AUDIT_V0_22.json
