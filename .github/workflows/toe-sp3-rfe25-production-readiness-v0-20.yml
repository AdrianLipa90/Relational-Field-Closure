name: ToE SP3 RF-E25 production readiness v0.20

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC4H_SP3_RFE25_PRODUCTION_READINESS_V0_20.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_rfe25_production_readiness_v0_20.py"
      - ".github/workflows/toe-sp3-rfe25-production-readiness-v0-20.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC4H_SP3_RFE25_PRODUCTION_READINESS_V0_20.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_rfe25_production_readiness_v0_20.py"
      - ".github/workflows/toe-sp3-rfe25-production-readiness-v0-20.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy pytest
      - name: Validate provenance wrapper parents
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q tests/reference/test_gsc4a_shift_source_provenance.py
          pytest -q tests/reference/test_gsc4a_source_assembled_shared_spacetime_atlas.py
      - name: Validate RF-E25 production-packet readiness
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_rfe25_production_readiness_v0_20.py | tee build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
          grep -Fq '"status": "PASS"' build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
          grep -Fq '"all_six_reduced_packet_coordinates_populated_structurally": true' build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
          grep -Fq '"GSC4A_provenance_wrapper_PASS": true' build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
          grep -Fq '"missing_software_operators_zero": true' build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
          grep -Fq '"production_admission_remains_false": true' build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
          grep -Fq '"physical_production_claim": false' build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-rfe25-production-readiness-v0-20
          path: build/SP3_RFE25_PRODUCTION_READINESS_V0_20.json
