name: ToE SP3 physical embedding gate v0.23

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5F_SP3_PHYSICAL_EMBEDDING_GATE_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_physical_embedding_gate_v0_23.py"
      - ".github/workflows/toe-sp3-physical-embedding-gate-v0-23.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5F_SP3_PHYSICAL_EMBEDDING_GATE_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_physical_embedding_gate_v0_23.py"
      - ".github/workflows/toe-sp3-physical-embedding-gate-v0-23.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy
      - name: Validate direct-R3 projection no-go and embedding gate
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_physical_embedding_gate_v0_23.py | tee build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
          grep -Fq '"status": "PASS"' build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
          grep -Fq '"direct_R3_projection_is_globally_noninjective": true' build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
          grep -Fq '"raw_clock_feature_is_not_promoted_to_physical_event_time": true' build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
          grep -Fq '"external_source_field_without_embedding_is_not_W6": true' build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
          grep -Fq '"physical_embedding_Psi": "OPEN"' build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
          grep -Fq '"physical_production_claim": false' build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-physical-embedding-gate-v0-23
          path: build/SP3_PHYSICAL_EMBEDDING_GATE_V0_23.json
