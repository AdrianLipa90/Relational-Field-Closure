name: ToE SP3-only W6 source insufficiency v0.24

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5G_SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_only_w6_source_insufficiency_v0_24.py"
      - ".github/workflows/toe-sp3-only-w6-insufficiency-v0-24.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5G_SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_only_w6_source_insufficiency_v0_24.py"
      - ".github/workflows/toe-sp3-only-w6-insufficiency-v0-24.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Validate current SP3-only W6 insufficiency
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_only_w6_source_insufficiency_v0_24.py | tee build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
          grep -Fq '"status": "PASS"' build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
          grep -Fq '"SP3_only_missing_source_tensor_rejected_by_v021_contract": true' build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
          grep -Fq '"SP3_only_geometry_derived_source_rejected_by_v021_contract": true' build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
          grep -Fq '"SP3_only_unsupported_vacuum_rejected_by_v021_contract": true' build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
          grep -Fq '"SP3_only_anchor_coverage_rejected_by_v021_contract": true' build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
          grep -Fq '"external_source_augmentation_required_under_current_contract": true' build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
          grep -Fq '"physical_production_claim": false' build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-only-w6-insufficiency-v0-24
          path: build/SP3_ONLY_W6_SOURCE_INSUFFICIENCY_V0_24.json
