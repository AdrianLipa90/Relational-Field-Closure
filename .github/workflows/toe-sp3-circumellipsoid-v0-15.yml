name: ToE SP3 canonical circumellipsoid v0.15

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC3J_SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_canonical_circumellipsoid_v0_15.py"
      - ".github/workflows/toe-sp3-circumellipsoid-v0-15.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC3J_SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_canonical_circumellipsoid_v0_15.py"
      - ".github/workflows/toe-sp3-circumellipsoid-v0-15.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Validate canonical smooth carrier
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_canonical_circumellipsoid_v0_15.py | tee build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
          grep -Fq '"status": "PASS"' build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
          grep -Fq '"all_five_source_points_lie_on_Q_unit_ellipsoid_exactly": true' build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
          grep -Fq '"all_pairwise_Q_inner_products_equal_minus_one_quarter_exactly": true' build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
          grep -Fq '"Q_positive_definite_by_sylvester": true' build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
          grep -Fq '"affine_beta_interpolant_recovers_all_source_values_exactly": true' build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
          grep -Fq '"physical_production_claim": false' build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-circumellipsoid-v0-15
          path: build/SP3_CANONICAL_CIRCUMELLIPSOID_V0_15.json
