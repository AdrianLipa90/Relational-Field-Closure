name: ToE SP3 affine physical binding no-go v0.24

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5G_SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_affine_physical_binding_nogo_v0_24.py"
      - ".github/workflows/toe-sp3-affine-physical-binding-nogo-v0-24.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5G_SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_affine_physical_binding_nogo_v0_24.py"
      - ".github/workflows/toe-sp3-affine-physical-binding-nogo-v0-24.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy
      - name: Validate affine physical-spacetime binding no-go
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_affine_physical_binding_nogo_v0_24.py | tee build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
          grep -Fq '"status": "PASS"' build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
          grep -Fq '"feature_midpoint_affine_rank_is_four": true' build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
          grep -Fq '"physical_same_epoch_affine_rank_is_at_most_three": true' build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
          grep -Fq '"invertible_affine_feature_to_physical_spacetime_binding_is_impossible": true' build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
          grep -Fq '"literal_3plus1_feature_record_is_not_literal_spacetime_coordinate_tuple": true' build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
          grep -Fq '"physical_production_claim": false' build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-affine-physical-binding-nogo-v0-24
          path: build/SP3_AFFINE_PHYSICAL_BINDING_NOGO_V0_24.json
