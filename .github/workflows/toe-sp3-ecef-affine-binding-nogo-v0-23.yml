name: ToE SP3 ECEF affine binding no-go v0.23

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC3G_SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_ecef_affine_binding_nogo_v0_23.py"
      - ".github/workflows/toe-sp3-ecef-affine-binding-nogo-v0-23.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC3G_SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_ecef_affine_binding_nogo_v0_23.py"
      - ".github/workflows/toe-sp3-ecef-affine-binding-nogo-v0-23.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Validate ECEF affine binding no-go
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_ecef_affine_binding_nogo_v0_23.py | tee build/SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.json
          grep -Fq '"status": "PASS"' build/SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.json
          grep -Fq '"fifth_anchor_rejects_same_affine_map": true' build/SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.json
          grep -Fq '"left_null_affine_compatibility_condition_fails": true' build/SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.json
          grep -Fq '"no_global_ECEF_to_candidate_chart_affine_binding_on_five_anchors": true' build/SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.json
          grep -Fq '"physical_production_claim": false' build/SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-ecef-affine-binding-nogo-v0-23
          path: build/SP3_ECEF_AFFINE_BINDING_NOGO_V0_23.json
