name: ToE SP3 geometry source signature v0.23

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5F_SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_geometry_source_signature_diagnostic_v0_23.py"
      - ".github/workflows/toe-sp3-geometry-source-signature-v0-23.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5F_SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_geometry_source_signature_diagnostic_v0_23.py"
      - ".github/workflows/toe-sp3-geometry-source-signature-v0-23.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy
      - name: Validate geometry-implied source signature diagnostic
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_geometry_source_signature_diagnostic_v0_23.py | tee build/SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.json
          grep -Fq '"status": "PASS"' build/SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.json
          grep -Fq '"diagnostic_does_not_promote_W6": true' build/SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.json
          grep -Fq '"T_from_geometry_not_used_as_physical_evidence": true' build/SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.json
          grep -Fq '"physical_production_claim": false' build/SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-geometry-source-signature-v0-23
          path: build/SP3_GEOMETRY_SOURCE_SIGNATURE_DIAGNOSTIC_V0_23.json
