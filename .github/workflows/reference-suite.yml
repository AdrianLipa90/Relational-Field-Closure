name: RFC reference suite

on:
  push:
    branches:
      - main
    paths:
      - 'closure/**'
      - 'formalism/**'
      - 'experiments/**'
      - 'tests/reference/**'
      - 'validation/**'
      - 'tools/run_reference_suite_with_fpdg_receipt.py'
      - 'CROSS_REFERENCE_LOCK.json'
      - '.github/workflows/reference-suite.yml'
  pull_request:
    paths:
      - 'closure/**'
      - 'formalism/**'
      - 'experiments/**'
      - 'tests/reference/**'
      - 'validation/**'
      - 'tools/run_reference_suite_with_fpdg_receipt.py'
      - 'CROSS_REFERENCE_LOCK.json'
      - '.github/workflows/reference-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install pytest numpy
      - name: Run RFC reference suite with exact FPDG failure receipt
        run: python tools/run_reference_suite_with_fpdg_receipt.py
      - name: Upload FPDG validation failure receipt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fpdg-validation-failure-receipt
          path: build/FPDG_VALIDATION_FAILURE_RECEIPT.json
          if-no-files-found: warn
