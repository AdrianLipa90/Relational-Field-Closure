name: RFC chemistry carrier identifiability no-go

on:
  pull_request:
    paths:
      - 'formalism/RF_CHEMISTRY_CARRIER_SCALE_IDENTIFIABILITY_NOGO_V0_1.md'
      - 'src/rfc/chemistry_carrier_scale_identifiability.py'
      - 'tests/reference/test_rfc_chemistry_carrier_scale_identifiability.py'
      - 'DEPENDENCY_EXPORT.json'
      - '.github/workflows/chemistry-carrier-identifiability-nogo-v01.yml'
  workflow_dispatch:

jobs:
  identifiability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install pytest
      - name: Run carrier-scale identifiability tests
        run: python -m pytest -q tests/reference/test_rfc_chemistry_carrier_scale_identifiability.py
