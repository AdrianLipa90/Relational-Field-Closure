name: ToE SP3 archive W6 sufficiency no-go v0.22

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5E_CURRENT_SP3_ARCHIVE_W6_SUFFICIENCY_NOGO_V0_22.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_w6_archive_sufficiency_nogo_v0_22.py"
      - ".github/workflows/toe-sp3-w6-archive-sufficiency-nogo-v0-22.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC5E_CURRENT_SP3_ARCHIVE_W6_SUFFICIENCY_NOGO_V0_22.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_w6_archive_sufficiency_nogo_v0_22.py"
      - ".github/workflows/toe-sp3-w6-archive-sufficiency-nogo-v0-22.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: Revalidate v0.21 W6 source contract
        env:
          PYTHONPATH: .:src
        run: |
          python experiments/toe_solver_candidate_v0_1/sp3_w6_physical_source_receipt_contract_v0_21.py > /tmp/w6_v021.json
          grep -Fq '"status": "PASS"' /tmp/w6_v021.json
      - name: Validate current SP3 archive W6 sufficiency no-go
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_w6_archive_sufficiency_nogo_v0_22.py | tee build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
          grep -Fq '"status": "PASS"' build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
          grep -Fq '"raw_SP3_source_contains_no_W6_tensor_payload": true' build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
          grep -Fq '"v021_W6_contract_rejects_SP3_only_pseudo_packet": true' build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
          grep -Fq '"local_source_solver_consumes_metric_and_Einstein_tensor": true' build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
          grep -Fq '"multisector_source_solver_consumes_metric_and_Einstein_tensor": true' build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
          grep -Fq '"current_SP3_archive_W6_role": "INSUFFICIENT"' build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
          grep -Fq '"physical_production_claim": false' build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-w6-archive-sufficiency-nogo-v0-22
          path: build/SP3_W6_ARCHIVE_SUFFICIENCY_NOGO_V0_22.json
