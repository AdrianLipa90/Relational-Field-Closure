name: ToE SP3 source-lapse Lorentz coframe v0.17

on:
  pull_request:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC3L_SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_source_lapse_lorentz_coframe_v0_17.py"
      - ".github/workflows/toe-sp3-source-lapse-lorentz-coframe-v0-17.yml"
  push:
    paths:
      - "experiments/toe_solver_candidate_v0_1/RF_GSC3L_SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.md"
      - "experiments/toe_solver_candidate_v0_1/sp3_source_lapse_lorentz_coframe_v0_17.py"
      - ".github/workflows/toe-sp3-source-lapse-lorentz-coframe-v0-17.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Validate source-lapse Lorentz coframe
        run: |
          mkdir -p build
          python experiments/toe_solver_candidate_v0_1/sp3_source_lapse_lorentz_coframe_v0_17.py | tee build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
          grep -Fq '"status": "PASS"' build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
          grep -Fq '"global_lapse_strictly_positive_by_analytic_ellipsoid_bound": true' build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
          grep -Fq '"ADM_spatial_coframe_annihilates_matching_X": true' build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
          grep -Fq '"metric_has_one_negative_three_positive_eigenvalues": true' build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
          grep -Fq '"metric_determinant_equals_minus_lapse_squared": true' build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
          grep -Fq '"physical_production_claim": false' build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
      - uses: actions/upload-artifact@v4
        with:
          name: toe-sp3-source-lapse-lorentz-coframe-v0-17
          path: build/SP3_SOURCE_LAPSE_LORENTZ_COFRAME_V0_17.json
